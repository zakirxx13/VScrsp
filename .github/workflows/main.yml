name: M3U8 Black Box Test

on:
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest

    steps:
      - name: Test M3U8 without authentication cookie
        env:
          TARGET_URL: "https://bldcmprod-cdn.toffee.com/cdn/live/cnn/playlist.m3u8"
        run: |
          set -e

          echo "=============================="
          echo " M3U8 BASELINE TEST"
          echo "=============================="

          curl -sS \
            -D headers.txt \
            -o playlist.txt \
            -w "\nHTTP_STATUS=%{http_code}\nCONTENT_TYPE=%{content_type}\nSIZE=%{size_download}\n" \
            "$TARGET_URL"

          echo ""
          echo "=== RESPONSE HEADERS ==="
          cat headers.txt

          echo ""
          echo "=== PLAYLIST PREVIEW ==="
          head -c 2000 playlist.txt

          echo ""
          echo ""
          echo "=== RESULT ==="

          STATUS=$(awk 'NR==1 {print $2}' headers.txt)

          if [ "$STATUS" = "200" ]; then
            echo "M3U8 accessible WITHOUT cookie."
          else
            echo "M3U8 rejected WITHOUT cookie."
          fi
