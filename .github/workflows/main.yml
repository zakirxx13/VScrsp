name: Toffee Channel Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  # প্রতি ৬ ঘন্টায় রান করবে

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Run scraper
        run: node scraper.js

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          git commit -m "Update channel data - $(date '+%Y-%m-%d %H:%M:%S')" || echo "No changes"
          git push
