name: Black Box Security Test

on:
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest

    steps:
      - name: Test public endpoint
        env:
          TARGET_URL: "https://YOUR-PUBLIC-TEST-URL-HERE"
        run: |
          set -e

          echo "=============================="
          echo " BLACK BOX BASELINE TEST"
          echo "=============================="

          echo ""
          echo "[1] HTTP RESPONSE"
          curl -sS \
            -D headers.txt \
            -o body.txt \
            -w "\nHTTP_STATUS=%{http_code}\nCONTENT_TYPE=%{content_type}\nFINAL_URL=%{url_effective}\n" \
            "$TARGET_URL"

          echo ""
          echo "[2] RESPONSE HEADERS"
          cat headers.txt

          echo ""
          echo "[3] RESPONSE BODY (first 2000 bytes)"
          head -c 2000 body.txt

          echo ""
          echo ""
          echo "=============================="
          echo " TEST COMPLETE"
          echo "=============================="
