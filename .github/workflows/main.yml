name: Toffee API Scraper (Python)

on:
  workflow_dispatch:
    inputs:
      content_hash:
        description: 'Content API Hash (optional)'
        required: false
        default: ''
  schedule:
    - cron: '0 */4 * * *'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests playwright
          playwright install --with-deps chromium

      - name: Run API Scraper
        env:
          CONTENT_HASH: ${{ github.event.inputs.content_hash }}
        run: python api_scraper.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          git commit -m "Update API data - $(date '+%Y-%m-%d %H:%M:%S')" || echo "No changes"
          git push
