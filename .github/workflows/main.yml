name: M3U8 Black Box Security Debug

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-m3u8:
    runs-on: ubuntu-latest

    env:
      TARGET_HOST: "bldcmprod-cdn.toffeelive.com"
      TARGET_URL: "https://bldcmprod-cdn.toffeelive.com/cdn/live/somoy_tv/playlist.m3u8"
      TEST_USER_AGENT: "okhttp/4.11.0"

      # TEST ONLY
      # এখানে তোমার দেওয়া Edge-Cache-Cookie বসাও
      EDGE_CACHE_COOKIE: "Edge-Cache-Cookie=URLPrefix=aHR0cHM6Ly9ibGRjbXByb2QtY2RuLnRvZmZlZWxpdmUuY29t:Expires=1790002560:KeyName=prod_linear:Signature=QCQRc38fxcB1OJwFjuSE9QM3EGrG8r_6BRTO5qn-lijmx7s8NyOdr8cq8iQCgg4jkdDlsoBNqSOCJkNrg_z2BA"

    steps:

      # -----------------------------
      # 1. Checkout
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # 2. Prepare debug folder
      # -----------------------------
      - name: Prepare debug folder
        shell: bash
        run: |
          rm -rf debug/m3u8
          mkdir -p debug/m3u8

      # -----------------------------
      # 3. DNS Test
      # -----------------------------
      - name: DNS test
        shell: bash
        run: |
          {
            echo "===== TARGET ====="
            echo "$TARGET_URL"
            echo

            echo "===== HOST ====="
            echo "$TARGET_HOST"
            echo

            echo "===== GETENT ====="
            getent hosts "$TARGET_HOST" || true
            echo

            echo "===== NSLOOKUP ====="
            nslookup "$TARGET_HOST" || true
            echo

            echo "===== DIG A ====="
            dig "$TARGET_HOST" A +short || true
            echo

            echo "===== DIG AAAA ====="
            dig "$TARGET_HOST" AAAA +short || true
          } > debug/m3u8/dns.txt

          cat debug/m3u8/dns.txt

      # -----------------------------
      # 4. Test WITHOUT Cookie
      # -----------------------------
      - name: Test M3U8 without cookie
        shell: bash
        run: |
          set +e

          curl -4 -sS \
            -D debug/m3u8/no_cookie_headers.txt \
            -o debug/m3u8/no_cookie_body.txt \
            -H "User-Agent: $TEST_USER_AGENT" \
            --connect-timeout 15 \
            --max-time 30 \
            -w "HTTP_STATUS=%{http_code}\nCONTENT_TYPE=%{content_type}\nSIZE=%{size_download}\nTIME=%{time_total}\nREMOTE_IP=%{remote_ip}\n" \
            "$TARGET_URL" \
            > debug/m3u8/no_cookie_result.txt 2>&1

          echo "CURL_EXIT=$?" >> debug/m3u8/no_cookie_result.txt

          cat debug/m3u8/no_cookie_result.txt

          set -e

      # -----------------------------
      # 5. Test WITH Cookie
      # -----------------------------
      - name: Test M3U8 with Edge Cache Cookie
        shell: bash
        run: |
          set +e

          curl -4 -sS \
            -D debug/m3u8/cookie_headers.txt \
            -o debug/m3u8/cookie_body.txt \
            -H "User-Agent: $TEST_USER_AGENT" \
            -H "Cookie: $EDGE_CACHE_COOKIE" \
            --connect-timeout 15 \
            --max-time 30 \
            -w "HTTP_STATUS=%{http_code}\nCONTENT_TYPE=%{content_type}\nSIZE=%{size_download}\nTIME=%{time_total}\nREMOTE_IP=%{remote_ip}\n" \
            "$TARGET_URL" \
            > debug/m3u8/cookie_result.txt 2>&1

          echo "CURL_EXIT=$?" >> debug/m3u8/cookie_result.txt

          cat debug/m3u8/cookie_result.txt

          set -e

      # -----------------------------
      # 6. Analyze playlist
      # -----------------------------
      - name: Analyze responses
        shell: bash
        run: |
          {
            echo "======================================"
            echo "M3U8 BLACK BOX TEST"
            echo "======================================"
            echo

            echo "Target:"
            echo "$TARGET_URL"
            echo

            echo "User-Agent:"
            echo "$TEST_USER_AGENT"
            echo

            echo "======================================"
            echo "WITHOUT COOKIE"
            echo "======================================"
            cat debug/m3u8/no_cookie_result.txt
            echo

            if [ -s debug/m3u8/no_cookie_body.txt ]; then
              echo "--- Body preview ---"
              head -n 50 debug/m3u8/no_cookie_body.txt
            else
              echo "No response body."
            fi

            echo
            echo "======================================"
            echo "WITH COOKIE"
            echo "======================================"
            cat debug/m3u8/cookie_result.txt
            echo

            if [ -s debug/m3u8/cookie_body.txt ]; then
              echo "--- Body preview ---"
              head -n 50 debug/m3u8/cookie_body.txt
            else
              echo "No response body."
            fi

          } > debug/m3u8/analysis.txt

          cat debug/m3u8/analysis.txt

      # -----------------------------
      # 7. Detect HLS playlist
      # -----------------------------
      - name: Detect M3U8 format
        shell: bash
        run: |
          {
            echo "===== WITHOUT COOKIE ====="

            if grep -q "#EXTM3U" debug/m3u8/no_cookie_body.txt 2>/dev/null; then
              echo "HLS_PLAYLIST=YES"
            else
              echo "HLS_PLAYLIST=NO"
            fi

            echo
            echo "===== WITH COOKIE ====="

            if grep -q "#EXTM3U" debug/m3u8/cookie_body.txt 2>/dev/null; then
              echo "HLS_PLAYLIST=YES"
            else
              echo "HLS_PLAYLIST=NO"
            fi
          } > debug/m3u8/hls_check.txt

          cat debug/m3u8/hls_check.txt

      # -----------------------------
      # 8. Sanitize sensitive output
      # -----------------------------
      - name: Sanitize debug files
        shell: bash
        run: |
          # Never commit the actual cookie.
          rm -f debug/m3u8/cookie_body.txt

          # Remove possible Set-Cookie headers.
          for file in debug/m3u8/*.txt; do
            [ -f "$file" ] || continue

            sed -i -E \
              's/^[Ss]et-[Cc]ookie:.*$/Set-Cookie: [REDACTED]/' \
              "$file"

            sed -i -E \
              's/^[Aa]uthorization:.*$/Authorization: [REDACTED]/' \
              "$file"

            sed -i -E \
              's/Edge-Cache-Cookie=[^;[:space:]]*/Edge-Cache-Cookie=[REDACTED]/g' \
              "$file"
          done

      # -----------------------------
      # 9. Create final summary
      # -----------------------------
      - name: Create summary
        shell: bash
        run: |
          {
            echo "# M3U8 Black Box Test"
            echo
            echo "**Target:** \`$TARGET_URL\`"
            echo
            echo "**User-Agent:** \`$TEST_USER_AGENT\`"
            echo
            echo "## Without Cookie"
            echo '```text'
            cat debug/m3u8/no_cookie_result.txt
            echo '```'
            echo
            echo "## With Cookie"
            echo '```text'
            cat debug/m3u8/cookie_result.txt
            echo '```'
            echo
            echo "## HLS Detection"
            echo '```text'
            cat debug/m3u8/hls_check.txt
            echo '```'
            echo
            echo "## DNS"
            echo '```text'
            cat debug/m3u8/dns.txt
            echo '```'
          } > debug/m3u8/SUMMARY.md

          cat debug/m3u8/SUMMARY.md

      # -----------------------------
      # 10. Commit debug output
      # -----------------------------
      - name: Commit and push debug
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add debug/m3u8/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: M3U8 black box debug"
          git push
